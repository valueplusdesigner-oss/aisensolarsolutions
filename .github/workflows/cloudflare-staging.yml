name: Cloudflare staging deployment

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Type STAGING-ONLY to deploy to workers.dev (never production)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aisen-solar-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_staging == 'STAGING-ONLY' }}
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate staging source and account configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f wrangler.jsonc
          test -f src/index.js
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
          if grep -q 'REPLACE_AFTER_D1_CREATION' wrangler.jsonc; then
            echo "Set the staging D1 database ID in wrangler.jsonc before deploying" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and test
        run: |
          npm run check
          npm test
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:staging
